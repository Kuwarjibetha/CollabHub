<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CollabHub — User Profile</title>
  <meta name="description" content="View and manage your CollabHub user profile, update name, change profile picture, and change password." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/profile.css" />
</head>
<body>

  
  <header class="profile-topbar">
    <div class="topbar-left">
      <button class="btn-back" onclick="window.location.href='dashboard.html'">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        Back to Dashboard
      </button>
    </div>
    <div class="brand-logo">
      <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
        <path d="M8 20V12l6 4-6 4z" fill="url(#lg)"/>
        <path d="M16 12h8v8h-8z" fill="url(#lg)" opacity="0.75"/>
        <defs><linearGradient id="lg" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#7C3AED"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs>
      </svg>
      CollabHub
    </div>
  </header>

  
  <main class="profile-container">

    
    <div class="profile-card">
      <div class="hero-profile-box">
        <div class="avatar-wrapper">
          <div class="avatar-inner" id="avatar-display-box">U</div>
          <img id="avatar-img-box" src="" style="display:none;" />
          <label for="file-profile-pic" class="upload-badge" title="Upload New Picture">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </label>
          <input type="file" id="file-profile-pic" accept="image/*" style="display:none;" onchange="uploadPicture(event)" />
        </div>

        <div class="user-details">
          <h1 id="display-user-name">Loading User...</h1>
          <p id="display-user-email">user@example.com</p>
          <div class="role-badge">
            <svg width="12" height="12" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
            Active CollabHub Member
          </div>
        </div>
      </div>
    </div>

    
    <div class="profile-card">
      <h2 class="card-title">
        <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        Personal Information
      </h2>
      <form onsubmit="savePersonalDetails(event)">
        <div class="form-grid">
          <div class="form-group">
            <label for="input-name">Full Name</label>
            <input type="text" id="input-name" class="input-field" placeholder="Your Name" required />
          </div>
          <div class="form-group">
            <label for="input-email">Email Address</label>
            <input type="email" id="input-email" class="input-field" disabled />
          </div>
        </div>
        <div style="margin-top:20px;">
          <button type="submit" class="btn-save">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            Save Changes
          </button>
        </div>
      </form>
    </div>

    
    <div class="profile-card">
      <h2 class="card-title">
        <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        Change Password
      </h2>
      <form onsubmit="updatePassword(event)">
        <div class="form-grid">
          <div class="form-group">
            <label for="input-old-pass">Current Password</label>
            <input type="password" id="input-old-pass" class="input-field" placeholder="••••••••" required />
          </div>
          <div class="form-group">
            <label for="input-new-pass">New Password</label>
            <input type="password" id="input-new-pass" class="input-field" placeholder="Minimum 6 characters" required />
          </div>
        </div>
        <div style="margin-top:20px;">
          <button type="submit" class="btn-save">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Update Password
          </button>
        </div>
      </form>
    </div>

    
    <div class="profile-card" style="border-color:rgba(239,68,68,0.25);">
      <h2 class="card-title" style="color:#fca5a5;">
        <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Account Session
      </h2>
      <p style="font-size:0.875rem;color:var(--clr-text-muted);margin-bottom:20px;">
        Log out of your CollabHub account session on this device.
      </p>
      <button class="btn-danger-action" onclick="handleLogout()">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Log Out of CollabHub
      </button>
    </div>

  </main>

  <div class="toast-box" id="toast"></div>

  <script src="../../js/config.js?v=3.0"></script>
  <script src="../../js/pages/user/profile.js"></script>
</body>
</html>
